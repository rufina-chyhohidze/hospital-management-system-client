<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Modify Hospital</title>
</head>
<body class="container">
<h1 class="mb-3">Edit Hospital</h1>
<form>
    <div class="mb-3">
        <label for="hospital-id" class="form-label">Hospital ID</label>
        <input type="number" id="hospital-id" class="form-control" />
    </div>

    <button type="button" id="load-button" class="mb-3 btn btn-secondary">Load</button>

    <div class="mb-3">
        <label for="hospital-name" class="form-label">Name</label>
        <input type="text" id="hospital-name" class="form-control" />
    </div>

    <div class="mb-3">
        <label for="hospital-address" class="form-label">Address</label>
        <input type="text" id="hospital-address" class="form-control" />
    </div>

    <div class="mb-3">
        <label for="hospital-date" class="form-label">Established</label>
        <input type="date" id="hospital-date" class="form-control" />
    </div>

    <button type="button" id="update-button" class="btn btn-primary" disabled>Update</button>
</form>
</body>

</html>
